name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys are done by the server itself (scripts/auto-deploy.sh from cron); this only checks.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.neurodigitalsupport.com/api

